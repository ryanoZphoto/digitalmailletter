<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Send Letters Online - Professional Letter Printing & Mailing Service | SendLetters</title>
    <meta name="title" content="Send Letters Online - Professional Letter Printing & Mailing Service | SendLetters" />
    <meta name="description" content="Send physical letters online with professional printing and mailing. Perfect for business correspondence, legal notices, personal letters. Same-day processing, USPS delivery, full tracking." />
    <meta name="keywords" content="send letters online, mail letters, print and mail service, physical letters, business correspondence, legal notices, letter mailing service, USPS delivery" />
    <meta name="author" content="SendLetters" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://digitalmailletter.com" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://digitalmailletter.com" />
    <meta property="og:title" content="Send Letters Online - Professional Letter Printing & Mailing Service" />
    <meta property="og:description" content="Send physical letters online with professional printing and mailing. Same-day processing, USPS delivery, full tracking." />
    <meta property="og:image" content="https://digitalmailletter.com/og-image.jpg" />
    <meta property="og:site_name" content="Digital Mail Letter" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://digitalmailletter.com" />
    <meta property="twitter:title" content="Send Letters Online - Professional Letter Printing & Mailing Service" />
    <meta property="twitter:description" content="Send physical letters online with professional printing and mailing. Same-day processing, USPS delivery, full tracking." />
    <meta property="twitter:image" content="https://digitalmailletter.com/og-image.jpg" />
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "SendLetters",
      "description": "Professional letter printing and mailing service. Send physical letters online with same-day processing and USPS delivery.",
      "url": "https://digitalmailletter.com",
      "logo": "https://sendletters.com/logo.png",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "Customer Service",
        "availableLanguage": "English"
      },
      "sameAs": [
        "https://twitter.com/sendletters",
        "https://facebook.com/sendletters"
      ],
      "offers": {
        "@type": "Offer",
        "description": "Professional letter printing and mailing",
        "price": "2.50",
        "priceCurrency": "USD"
      }
    }
    </script>
    
    <!-- Performance & SEO -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta name="theme-color" content="#667eea" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

</html>
